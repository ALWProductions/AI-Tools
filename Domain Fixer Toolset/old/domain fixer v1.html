<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Spreadsheet Processing Tool V3.1</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; background-color: #f8fafc; line-height: 1.6; }
        .container { max-width: 1400px; margin: 0 auto; padding: 24px; background-color: white; min-height: 100vh; }
        .header { margin-bottom: 32px; }
        .title { font-size: 2rem; font-weight: bold; color: #1a202c; margin-bottom: 8px; }
        .version { color: #3182ce; font-weight: 600; }
        .subtitle { color: #718096; }
        .privacy-notice { background-color: #e6fffa; border: 1px solid #81e6d9; border-radius: 8px; padding: 12px; margin-bottom: 24px; }
        .privacy-text { color: #234e52; font-size: 0.875rem; display: flex; align-items: center; }
        .upload-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; margin-bottom: 32px; }
        .upload-area { border: 2px dashed #cbd5e0; border-radius: 8px; padding: 24px; text-align: center; cursor: pointer; transition: border-color 0.3s; }
        .upload-area:hover { border-color: #3182ce; }
        .multi-upload { border-color: #d69e2e; background-color: #fef5e7; }
        .multi-upload:hover { border-color: #b7791f; }
        .upload-icon { width: 48px; height: 48px; margin: 0 auto 8px; color: #a0aec0; }
        .upload-text { font-size: 0.875rem; color: #4a5568; margin-bottom: 4px; }
        .upload-subtext { font-size: 0.75rem; color: #a0aec0; }
        .file-name { margin-top: 8px; font-size: 0.875rem; font-weight: 500; color: #38a169; }
        .file-list { margin-top: 12px; text-align: left; max-height: 150px; overflow-y: auto; }
        .file-item { background: white; padding: 8px 12px; margin: 4px 0; border-radius: 4px; border: 1px solid #d69e2e; font-size: 0.75rem; display: flex; justify-content: space-between; align-items: center; }
        .file-remove { background: #e53e3e; color: white; border: none; padding: 2px 6px; border-radius: 3px; font-size: 0.6rem; cursor: pointer; }
        .message { padding: 16px; border-radius: 8px; margin-bottom: 24px; display: flex; align-items: center; }
        .message-success { background-color: #ebf8ff; color: #2b6cb0; }
        .message-error { background-color: #fed7d7; color: #c53030; }
        .operations { background-color: #f7fafc; border-radius: 8px; padding: 24px; margin-bottom: 32px; }
        .operations-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 16px; }
        .operations-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
        .operation-card { background-color: white; padding: 16px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .operation-header { font-weight: 500; margin-bottom: 12px; display: flex; align-items: center; }
        .description { font-size: 0.875rem; color: #6b7280; margin-bottom: 12px; }
        .form-group { margin-bottom: 12px; }
        .select, .input, .textarea { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 0.875rem; }
        .textarea { min-height: 100px; font-family: monospace; resize: vertical; }
        .button { width: 100%; padding: 8px 12px; border: none; border-radius: 4px; font-size: 0.875rem; font-weight: 500; cursor: pointer; transition: background-color 0.3s; display: flex; align-items: center; justify-content: center; }
        .button:disabled { opacity: 0.5; cursor: not-allowed; }
        .button-blue { background-color: #2563eb; color: white; }
        .button-green { background-color: #16a34a; color: white; }
        .button-gray { background-color: white; color: #4b5563; border: 1px solid #d1d5db; }
        .button-red { background-color: #dc2626; color: white; }
        .radio-group { margin: 8px 0; }
        .radio-option { display: flex; align-items: center; margin-bottom: 6px; }
        .radio-option input { margin-right: 8px; }
        .file-mapping { background-color: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 12px; margin-bottom: 12px; }
        .column-mapping { display: grid; grid-template-columns: 2fr 20px 2fr 20px; gap: 4px; align-items: center; margin-bottom: 8px; }
        .remove-btn { background: #ef4444; color: white; border: none; padding: 2px 6px; border-radius: 2px; font-size: 0.75rem; cursor: pointer; }
        .add-mapping { width: 100%; padding: 6px; border: 2px dashed #d1d5db; background: none; color: #6b7280; cursor: pointer; border-radius: 4px; font-size: 0.75rem; margin-top: 8px; }
        .confidence-badge { font-size: 0.6rem; padding: 2px 6px; border-radius: 10px; font-weight: 500; }
        .confidence-high { background-color: #d1fae5; color: #166534; }
        .results { background-color: white; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
        .results-header { padding: 16px 24px; border-bottom: 1px solid #e5e7eb; background-color: #f9fafb; display: flex; justify-content: space-between; align-items: center; }
        .table-container { overflow-x: auto; }
        .table { width: 100%; border-collapse: collapse; }
        .table th { padding: 12px 16px; text-align: left; font-size: 0.875rem; font-weight: 500; color: #374151; background-color: #f3f4f6; border-right: 1px solid #e5e7eb; }
        .table td { padding: 12px 16px; font-size: 0.875rem; color: #1f2937; border-right: 1px solid #e5e7eb; border-bottom: 1px solid #f3f4f6; }
        .provider-group-header { background-color: #f1f5f9; font-weight: bold; color: #475569; padding: 8px 16px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .preview-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
        .preview-content { background-color: white; border-radius: 8px; max-width: 1200px; width: 100%; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; }
        .preview-header { padding: 24px; border-bottom: 1px solid #e5e7eb; background-color: #fefce8; }
        .preview-body { padding: 24px; overflow-y: auto; flex: 1; }
        .preview-footer { padding: 24px; border-top: 1px solid #e5e7eb; background-color: #f9fafb; display: flex; justify-content: flex-end; gap: 12px; }
        .loading { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .spinner { width: 32px; height: 32px; border: 3px solid #f3f4f6; border-top: 3px solid #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useCallback, useMemo } = React;
        
        const SpreadsheetTool = () => {
            const [masterData, setMasterData] = useState(null);
            const [masterFileName, setMasterFileName] = useState('');
            const [comparisonFiles, setComparisonFiles] = useState([]);
            const [processedData, setProcessedData] = useState(null);
            const [operation, setOperation] = useState('');
            const [loading, setLoading] = useState(false);
            const [message, setMessage] = useState('');
            const [previewData, setPreviewData] = useState(null);
            const [showPreview, setShowPreview] = useState(false);
            const [recordsToProcess, setRecordsToProcess] = useState([]);
            const [deleteValue, setDeleteValue] = useState('');
            const [deleteColumn, setDeleteColumn] = useState('');
            const [filterType, setFilterType] = useState('exact');
            const [deleteListColumn, setDeleteListColumn] = useState('');
            const [deleteListValues, setDeleteListValues] = useState('test\ndemo\nspam');
            const [deleteListFilterType, setDeleteListFilterType] = useState('contains');
            const [emailColumn, setEmailColumn] = useState('');
            const [emailCorrections, setEmailCorrections] = useState([]);
            const [dedupeColumn, setDedupeColumn] = useState('');
            const [dedupeMethod, setDedupeMethod] = useState('random');
            const [dedupeCompareColumn, setDedupeCompareColumn] = useState('');
            const [fileMappings, setFileMappings] = useState({});

            // Enhanced Patterns to catch "gmail.", "gmail.c", etc.
            const emailPatterns = [
                { provider: 'Gmail', pattern: /@(g[ma]{1,2}il|gamil|gmial|gmaul)\.([a-z]{0,2})$|@(g[ma]{1,2}il|gamil|gmial|gmaul)$/i, correction: 'gmail.com', confidence: 'high' },
                { provider: 'Yahoo', pattern: /@(yaho{1,3}|yahho)\.([a-z]{0,2})$|@(yaho{1,3}|yahho)$/i, correction: 'yahoo.com', confidence: 'high' },
                { provider: 'Hotmail', pattern: /@(hotm[ia]{1,2}l|hotmale)\.([a-z]{0,2})$|@(hotm[ia]{1,2}l|hotmale)$/i, correction: 'hotmail.com', confidence: 'high' },
                { provider: 'Outlook', pattern: /@(outl[o0]{1,2}k|outlook)\.([a-z]{0,2})$|@(outl[o0]{1,2}k|outlook)$/i, correction: 'outlook.com', confidence: 'high' },
                { provider: 'AOL', pattern: /@(ao|aol)\.([a-z]{0,2})$|@(ao|aol)$/i, correction: 'aol.com', confidence: 'high' },
                { provider: 'iCloud', pattern: /@(icloud|icold|iclud)\.([a-z]{0,2})$|@(icloud|icold|iclud)$/i, correction: 'icloud.com', confidence: 'high' }
            ];

            const parseFile = useCallback(async (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const data = new Uint8Array(e.target.result);
                            const workbook = XLSX.read(data, { type: 'array' });
                            const sheetName = workbook.SheetNames[0];
                            const worksheet = workbook.Sheets[sheetName];
                            const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                            if (jsonData.length === 0) throw new Error('File is empty');
                            const headers = jsonData[0];
                            const rows = jsonData.slice(1).map((row, index) => {
                                const obj = { _originalIndex: index };
                                headers.forEach((header, headerIndex) => { obj[header] = row[headerIndex] || ''; });
                                return obj;
                            });
                            resolve({ headers, rows });
                        } catch (error) { reject(error); }
                    };
                    reader.readAsArrayBuffer(file);
                });
            }, []);

            const handleMasterFileUpload = async (file) => {
                setLoading(true);
                try {
                    const result = await parseFile(file);
                    setMasterData(result);
                    setMasterFileName(file.name);
                    setMessage(`Master file uploaded: ${result.rows.length} records.`);
                } catch (error) { setMessage(`Error: ${error.message}`); }
                setLoading(false);
            };

            const findEmailCorrections = (rows, col) => {
                const corrections = [];
                rows.forEach((row, index) => {
                    const email = String(row[col] || '').toLowerCase().trim();
                    if (!email.includes('@')) return;
                    for (const p of emailPatterns) {
                        if (p.pattern.test(email)) {
                            const corrected = email.replace(p.pattern, `@${p.correction}`);
                            if (corrected !== email) {
                                corrections.push({
                                    index, provider: p.provider, original: row[col], corrected, confidence: p.confidence, selected: true
                                });
                                break;
                            }
                        }
                    }
                });
                return corrections;
            };

            const previewEmailCorrections = () => {
                if (!masterData || !emailColumn) return setMessage('Select email column.');
                const corrections = findEmailCorrections(masterData.rows, emailColumn);
                if (corrections.length === 0) return setMessage('No issues found.');
                setEmailCorrections(corrections);
                setOperation('Email corrections');
                setShowPreview(true);
            };

            const confirmOperation = () => {
                if (operation === 'Email corrections') {
                    const updated = { ...masterData, rows: [...masterData.rows] };
                    emailCorrections.filter(c => c.selected).forEach(c => {
                        updated.rows[c.index][emailColumn] = c.corrected;
                    });
                    setProcessedData(updated);
                    setMessage('Corrections applied.');
                }
                setShowPreview(false);
            };

            const groupedCorrections = useMemo(() => {
                return emailCorrections.reduce((acc, curr) => {
                    if (!acc[curr.provider]) acc[curr.provider] = [];
                    acc[curr.provider].push(curr);
                    return acc;
                }, {});
            }, [emailCorrections]);

            const downloadProcessed = () => {
                const ws = XLSX.utils.json_to_sheet(processedData.rows.map(({_originalIndex, ...r}) => r));
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Processed');
                XLSX.writeFile(wb, `Cleaned_${masterFileName}`);
            };

            return (
                <div className="container">
                    <div className="header">
                        <h1 className="title">Spreadsheet Cleanup Tool <span className="version">V3.1</span></h1>
                        <p className="subtitle">Advanced email domain correction & grouping</p>
                    </div>

                    <div className="upload-grid">
                        <div className="upload-area" onClick={() => document.getElementById('mu').click()}>
                            <input type="file" id="mu" className="hidden" onChange={e => handleMasterFileUpload(e.target.files[0])} />
                            <p className="upload-text">Upload Master File</p>
                            {masterFileName && <p className="file-name">✓ {masterFileName}</p>}
                        </div>
                    </div>

                    {message && <div className="message message-success">{message}</div>}

                    {masterData && (
                        <div className="operations">
                            <div className="operation-card">
                                <h3 className="operation-header">✉️ Identify & Fix Emails</h3>
                                <p className="description">Finds "gmail.", "gmail.c", "gamil" etc. and groups them for review.</p>
                                <select className="select" onChange={e => setEmailColumn(e.target.value)}>
                                    <option>Select Email Column...</option>
                                    {masterData.headers.map(h => <option key={h} value={h}>{h}</option>)}
                                </select>
                                <button className="button button-blue" style={{marginTop:'10px'}} onClick={previewEmailCorrections}>Find Issues</button>
                            </div>
                        </div>
                    )}

                    {showPreview && (
                        <div className="preview-modal">
                            <div className="preview-content">
                                <div className="preview-header">
                                    <h3>Review Email Corrections</h3>
                                    <p>{emailCorrections.length} issues identified across {Object.keys(groupedCorrections).length} providers.</p>
                                </div>
                                <div className="preview-body">
                                    <table className="table">
                                        <thead>
                                            <tr><th>Apply</th><th>Original Value</th><th>Suggested Fix</th></tr>
                                        </thead>
                                        <tbody>
                                            {Object.entries(groupedCorrections).map(([provider, items]) => (
                                                <React.Fragment key={provider}>
                                                    <tr><td colSpan="3" className="provider-group-header">{provider} Issues</td></tr>
                                                    {items.map((c, i) => (
                                                        <tr key={i}>
                                                            <td><input type="checkbox" checked={c.selected} onChange={() => {
                                                                const next = [...emailCorrections];
                                                                const idx = next.findIndex(x => x.index === c.index);
                                                                next[idx].selected = !next[idx].selected;
                                                                setEmailCorrections(next);
                                                            }} /></td>
                                                            <td><code style={{color:'#dc2626'}}>{c.original}</code></td>
                                                            <td><code style={{color:'#16a34a'}}>{c.corrected}</code></td>
                                                        </tr>
                                                    ))}
                                                </React.Fragment>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                                <div className="preview-footer">
                                    <button className="button button-gray" onClick={() => setShowPreview(false)}>Cancel</button>
                                    <button className="button button-green" onClick={confirmOperation}>Apply Selected Fixes</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {processedData && (
                        <div className="results">
                            <div className="results-header">
                                <h3>Preview Cleaned Data</h3>
                                <button className="button button-green" onClick={downloadProcessed}>Download Fixed Excel</button>
                            </div>
                            <div className="table-container">
                                <table className="table">
                                    <thead><tr>{processedData.headers.map(h => <th key={h}>{h}</th>)}</tr></thead>
                                    <tbody>
                                        {processedData.rows.slice(0, 10).map((r, i) => (
                                            <tr key={i}>{processedData.headers.map(h => <td key={h}>{String(r[h])}</td>)}</tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        ReactDOM.render(<SpreadsheetTool />, document.getElementById('root'));
    </script>
</body>
</html>
