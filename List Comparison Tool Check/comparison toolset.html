<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Audit &amp; Triage Tool</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --blue: #2563eb; --red: #dc2626; --green: #16a34a; --slate: #334155; }
        body { font-family: -apple-system, sans-serif; background: #f8fafc; padding: 20px; color: var(--slate); }
        .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 30px; }
        h1 { font-size: 22px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 20px; }
        .upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .box { border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; background: #fff; }
        .box h3 { margin-bottom: 10px; font-size: 15px; color: var(--slate); }
        input[type="file"] { width: 100%; font-size: 12px; }
        .actions { text-align: center; margin: 30px 0; }
        .btn { padding: 12px 24px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; color: white; margin: 5px; transition: opacity 0.2s; }
        .btn-audit { background: var(--blue); }
        .btn-save { background: var(--green); display: none; }
        .btn-guide { background: #64748b; }
        .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; display: none; }
        .card { padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #e2e8f0; }
        .card .val { font-size: 24px; font-weight: bold; display: block; }
        .card .lbl { font-size: 12px; color: #64748b; text-transform: uppercase; }
        .log-box { background: #1e293b; color: #cbd5e1; padding: 15px; border-radius: 6px; font-family: monospace; font-size: 12px; height: 150px; overflow-y: auto; margin-top: 20px; }
        .table-wrap { overflow-x: auto; max-height: 300px; border: 1px solid #e2e8f0; margin-top: 20px; display: none; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; position: sticky; top: 0; }
        .tag { padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 10px; }
        .tag-new { background: #dcfce7; color: #166534; }
        .tag-missing { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

<div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h1>Email Audit &amp; Discrepancy Triage</h1>
        <button class="btn btn-guide" onclick="downloadPDFGuide()">Download Guide (PDF)</button>
    </div>

    <div class="upload-grid">
        <div class="box">
            <h3>List A (Original Send)</h3>
            <input type="file" id="fileA" accept=".csv">
        </div>
        <div class="box">
            <h3>List B (New List)</h3>
            <input type="file" id="fileB" accept=".csv">
        </div>
    </div>

    <div class="actions">
        <button class="btn btn-audit" onclick="runEmailAudit()">Identify Differences</button>
        <button id="saveBtn" class="btn btn-save" onclick="saveTriageFile()">Save Results as CSV</button>
    </div>

    <div id="summary" class="summary-grid">
        <div class="card">
            <span id="statCommon" class="val">0</span>
            <span class="lbl">Emails in Both Lists</span>
        </div>
        <div class="card" style="border-top: 4px solid var(--red);">
            <span id="statMissing" class="val">0</span>
            <span class="lbl">Emails Not Found in List B</span>
        </div>
        <div class="card" style="border-top: 4px solid var(--green);">
            <span id="statNew" class="val">0</span>
            <span class="lbl">New Records in List B, not in List A</span>
        </div>
    </div>

    <div id="tableWrap" class="table-wrap">
        <table id="resultTable"></table>
    </div>

    <div id="log" class="log-box">Loading...</div>
    <button class="btn" style="background: #475569; font-size: 11px; margin-top: 10px;" onclick="downloadLog()">Download Audit Log (.txt)</button>
</div>

<script>
    let auditResults = [];
    let auditLog = [];

    function log(msg) {
        const time = new Date().toLocaleTimeString();
        auditLog.push(`[${time}] ${msg}`);
        document.getElementById('log').innerHTML = auditLog.join('<br>');
        document.getElementById('log').scrollTop = document.getElementById('log').scrollHeight;
    }

    async function parse(file) {
        return new Promise(res => Papa.parse(file, { header: true, skipEmptyLines: true, complete: r => res(r.data) }));
    }

    async function runEmailAudit() {
        const fA = document.getElementById('fileA').files[0];
        const fB = document.getElementById('fileB').files[0];
        if (!fA || !fB) return alert("Please upload both files.");

        log("Reading files...");
        const dataA = await parse(fA);
        const dataB = await parse(fB);

        const findEmailKey = (data) => {
            const keys = Object.keys(data[0]);
            return keys.find(k => k.toLowerCase().includes('email')) || keys[0];
        };

        const keyA = findEmailKey(dataA);
        const keyB = findEmailKey(dataB);
        log(`Using column "${keyA}" for List A and "${keyB}" for List B.`);

        const setA = new Map(dataA.map(r => [String(r[keyA]).trim().toLowerCase(), r]));
        const setB = new Map(dataB.map(r => [String(r[keyB]).trim().toLowerCase(), r]));

        auditResults = [];
        let countNew = 0;
        let countMissing = 0;
        let countCommon = 0;

        // Check for new emails in B (the 3368 list)
        setB.forEach((row, email) => {
            if (!setA.has(email)) {
                auditResults.push({ Email: email, Status: "New in List B", ...row });
                countNew++;
            } else {
                countCommon++;
            }
        });

        // Check for emails that dropped off from A
        setA.forEach((row, email) => {
            if (!setB.has(email)) {
                auditResults.push({ Email: email, Status: "Missing from List B", ...row });
                countMissing++;
            }
        });

        log(`Audit complete: Found ${countNew} new emails and ${countMissing} missing emails.`);
        
        document.getElementById('statCommon').textContent = countCommon;
        document.getElementById('statMissing').textContent = countMissing;
        document.getElementById('statNew').textContent = countNew;
        document.getElementById('summary').style.display = 'grid';
        document.getElementById('saveBtn').style.display = 'inline-block';
        
        renderTable(auditResults);
    }

    function renderTable(data) {
        const table = document.getElementById('resultTable');
        document.getElementById('tableWrap').style.display = 'block';
        if (!data.length) {
            table.innerHTML = "<tr><td>No differences found.</td></tr>";
            return;
        }
        const headers = ["Status", "Email", ...Object.keys(data[0]).filter(k => k !== 'Status' && k !== 'Email')];
        let html = `<thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>`;
        data.forEach(row => {
            html += `<tr>${headers.map(h => {
                if (h === 'Status') {
                    const cls = row[h].includes('New') ? 'tag-new' : 'tag-missing';
                    return `<td><span class="tag ${cls}">${row[h]}</span></td>`;
                }
                return `<td>${row[h] || ''}</td>`;
            }).join('')}</tr>`;
        });
        table.innerHTML = html + "</tbody>";
    }

    async function saveTriageFile() {
        const csv = Papa.unparse(auditResults);
        try {
            const handle = await window.showSaveFilePicker({
                suggestedName: 'Email_Triage_Results.csv',
                types: [{ description: 'CSV', accept: {'text/csv': ['.csv']} }]
            });
            const writable = await handle.createWritable();
            await writable.write(csv);
            await writable.close();
        } catch (e) {
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'Email_Triage_Results.csv'; a.click();
        }
    }

    function downloadLog() {
        const blob = new Blob([auditLog.join('\n')], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'audit_log.txt'; a.click();
    }

    function downloadPDFGuide() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(18); doc.text("Email Triage Tool Guide", 10, 20);
        doc.setFontSize(12);
        doc.text("Purpose: Resolve list size discrepancies (e.g., 3345 vs 3368).", 10, 35);
        doc.text("1. Upload 'List A' (The 3345 file).", 10, 45);
        doc.text("2. Upload 'List B' (The 3368 file).", 10, 55);
        doc.text("3. Click 'Identify Differences'.", 10, 65);
        doc.text("4. Review 'New in B' - These are the emails that caused the increase.", 10, 75);
        doc.text("5. Review 'Missing from B' - Emails that were lost.", 10, 85);
        doc.text("6. Save results to CSV for manual lookup in your database.", 10, 95);
        doc.save("Email_Triage_Guide.pdf");
    }
</script>
</body>
</html>
