<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>South New Donor Welcome - Prep Tool</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8fafc; padding: 40px; color: #1e293b; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); padding: 40px; border: 1px solid #e2e8f0; }
        h1 { color: #0f172a; margin-bottom: 8px; font-size: 22px; }
        p.subtitle { color: #64748b; margin-bottom: 24px; font-size: 14px; }
        .upload-area { border: 2px dashed #cbd5e1; padding: 40px; border-radius: 8px; text-align: center; background: #f1f5f9; cursor: pointer; transition: all 0.2s; }
        .upload-area:hover { border-color: #3b82f6; background: #eff6ff; }
        input[type="file"] { display: none; }
        .btn { display: inline-block; padding: 12px 24px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 20px; text-decoration: none; font-size: 15px; }
        .btn:hover { background: #1d4ed8; }
        .btn-download { background: #059669; display: none; margin-top: 10px; }
        .btn-download:hover { background: #047857; }
        .status { margin-top: 20px; padding: 12px; border-radius: 6px; font-size: 14px; display: none; line-height: 1.5; }
        .status.success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; display: block; }
        .status.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; display: block; }
        .preview-label { margin-top: 30px; font-weight: 700; font-size: 13px; text-transform: uppercase; color: #64748b; display: none; }
        .preview-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; display: none; overflow-x: auto; }
        th, td { padding: 8px; text-align: left; border: 1px solid #e2e8f0; }
        th { background: #f8fafc; color: #475569; }
    </style>
</head>
<body>

<div class="container">
    <h1>Donor Welcome Prep Tool</h1>
    <p class="subtitle">Upload your file to filter, rename, and generate site acronyms.</p>

    <label for="fileInput" class="upload-area" id="dropZone">
        <strong>Click to Upload</strong> or drag and drop<br>
        <span style="font-size: 12px; color: #64748b;">Accepts .csv, .xlsx, .xls</span>
    </label>
    <input type="file" id="fileInput" accept=".csv,.xlsx,.xls">

    <div id="statusBox" class="status"></div>
    
    <button id="downloadBtn" class="btn btn-download">Download Prepped CSV</button>

    <div id="previewLabel" class="preview-label">Data Preview (First 5 rows)</div>
    <div style="overflow-x: auto;">
        <table id="previewTable" class="preview-table"></table>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const statusBox = document.getElementById('statusBox');
    const downloadBtn = document.getElementById('downloadBtn');
    const previewTable = document.getElementById('previewTable');
    const previewLabel = document.getElementById('previewLabel');

    let processedData = [];

    // The logic to find the original columns regardless of spaces/casing
    const fieldMapping = {
        'cns_lookupid': 'BBCRM lookupID',
        'cns_firstname': 'first_name',
        'cns_keyname': 'last_name',
        'cnsemailadrs_emailaddress': 'Email',
        'cnssodivpriaffinityattribute_value': 'CnsSoDIVPriAffinityAttribute_VALUE'
    };

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const isCSV = file.name.toLowerCase().endsWith('.csv');
        
        if (isCSV) {
            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: (results) => processRows(results.data)
            });
        } else {
            const reader = new FileReader();
            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                processRows(json);
            };
            reader.readAsArrayBuffer(file);
        }
    });

    function processRows(rawData) {
        if (!rawData || rawData.length === 0) {
            showStatus("Error: The file appears to be empty.", "error");
            return;
        }

        // Helper to find key in row object case-insensitively
        const getVal = (row, targetKey) => {
            const keys = Object.keys(row);
            const foundKey = keys.find(k => k.trim().toLowerCase() === targetKey.toLowerCase());
            return foundKey ? String(row[foundKey]).trim() : "";
        };

        try {
            processedData = rawData.map(row => {
                const affinityVal = getVal(row, 'CnsSoDIVPriAffinityAttribute_VALUE');
                
                // Construct the row in the specific requested order
                return {
                    'siteacronym': affinityVal ? `CA-${affinityVal}` : '',
                    'CnsSoDIVPriAffinityAttribute_VALUE': affinityVal,
                    'BBCRM lookupID': getVal(row, 'Cns_LOOKUPID'),
                    'first_name': getVal(row, 'Cns_FIRSTNAME'),
                    'last_name': getVal(row, 'Cns_KEYNAME'),
                    'Email': getVal(row, 'CnsEmailAdrs_EMAILADDRESS')
                };
            });

            showStatus(`Successfully prepped ${processedData.length} rows.`, "success");
            renderPreview(processedData.slice(0, 5));
            downloadBtn.style.display = 'inline-block';
        } catch (err) {
            showStatus("Error processing file: " + err.message, "error");
        }
    }

    function renderPreview(data) {
        const headers = Object.keys(data[0]);
        let html = '<thead><tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>';
        data.forEach(row => {
            html += '<tr>' + headers.map(h => `<td>${row[h]}</td>`).join('') + '</tr>';
        });
        html += '</tbody>';
        previewTable.innerHTML = html;
        previewTable.style.display = 'table';
        previewLabel.style.display = 'block';
    }

    downloadBtn.addEventListener('click', () => {
        const csv = Papa.unparse(processedData);
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", "Prepped_Donor_List.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });

    function showStatus(msg, type) {
        statusBox.textContent = msg;
        statusBox.className = 'status ' + type;
    }
</script>

</body>
</html>
